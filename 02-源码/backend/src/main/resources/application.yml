server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mom-baby-crm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/new_064?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: "mom-baby-crm-jwt-secret-key-for-graduation-project-2026-064"
    expire-hours: 12
  upload:
    dir: ./uploads

logging:
  level:
    root: INFO
    com.univ.momcare: INFO
